# test and dmg run on a gitlab-runner registered on a Mac with the "macos" tag (shell executor):
# swift, codesign and hdiutil are macOS-only. release runs on GitLab's shared Linux runners.

default:
  tags: [macos]

stages: [test, package, release]

test:
  stage: test
  script:
    - swift test

dmg:
  stage: package
  script:
    - scripts/make-dmg.sh
    # fixed name at the root: no build/ folder in the artifact, and a stable raw link:
    # https://gitlab.com/PioneerSwine996/wireguard/-/jobs/artifacts/main/raw/WireGuardBar.dmg?job=dmg
    - mv build/WireGuardBar-*.dmg WireGuardBar.dmg
  artifacts:
    name: "WireGuardBar-$CI_COMMIT_REF_SLUG"
    paths:
      - WireGuardBar.dmg
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# On a version tag (v1.2.3): a GitLab Release linking the DMG, then the same release on the
# GitHub mirror with the DMG uploaded. Needs the masked, protected CI/CD variable
# GITHUB_RELEASE_TOKEN (fine-grained GitHub token: Contents read/write on wireguard-bar-macos),
# and v* tags marked protected so that variable is available to tag pipelines.
release:
  stage: release
  inherit:
    default: false   # shared Linux runner, not the Mac
  image: alpine:3.20
  needs: [dmg]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    GITHUB_REPO: PioneerSwine996/wireguard-bar-macos
  script:
    - apk add --no-cache curl jq github-cli
    - test -n "$GITHUB_RELEASE_TOKEN" || { echo "GITHUB_RELEASE_TOKEN isn't set (or the tag isn't protected)"; exit 1; }
    - NOTES="Download WireGuardBar.dmg below. See CHANGELOG.md for what changed."
    # GitLab Release (the job token may create releases for its own project)
    - >
      jq -n --arg tag "$CI_COMMIT_TAG" --arg notes "$NOTES"
      --arg url "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/WireGuardBar.dmg?job=dmg"
      '{tag_name: $tag, name: ("WireGuard Bar " + $tag), description: $notes,
        assets: {links: [{name: "WireGuardBar.dmg", url: $url, link_type: "package"}]}}'
      > release.json
    - >
      curl --fail-with-body -sS -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json"
      --data @release.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
    # GitHub Release on the mirror; --target creates the tag at this commit if it isn't there yet
    - >
      GH_TOKEN="$GITHUB_RELEASE_TOKEN" gh release create "$CI_COMMIT_TAG" WireGuardBar.dmg
      --repo "$GITHUB_REPO" --target "$CI_COMMIT_SHA"
      --title "WireGuard Bar $CI_COMMIT_TAG" --notes "$NOTES"
