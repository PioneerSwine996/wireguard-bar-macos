# Runs on a gitlab-runner registered on a Mac with the "macos" tag (shell executor).
# swift, codesign and hdiutil are macOS-only, so GitLab's Linux shared runners can't build this.

default:
  tags: [macos]

stages: [test, package]

test:
  stage: test
  script:
    - swift test

dmg:
  stage: package
  script:
    - scripts/make-dmg.sh
  artifacts:
    name: "WireGuardBar-$CI_COMMIT_REF_SLUG"
    paths:
      - build/*.dmg
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
