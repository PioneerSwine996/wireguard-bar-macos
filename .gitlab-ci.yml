# Every job runs on a gitlab-runner registered on a Mac with the "macos" tag (shell executor):
# swift, codesign and hdiutil are macOS-only.

default:
  tags: [macos]

stages: [test, package, release]

test:
  stage: test
  script:
    - swift test

dmg:
  stage: package
  script:
    - scripts/make-dmg.sh
    # fixed name at the root: no build/ folder in the artifact, and a stable raw link:
    # https://gitlab.com/PioneerSwine996/wireguard/-/jobs/artifacts/main/raw/WireGuardBar.dmg?job=dmg
    - mv build/WireGuardBar-*.dmg WireGuardBar.dmg
  artifacts:
    name: "WireGuardBar-$CI_COMMIT_REF_SLUG"
    paths:
      - WireGuardBar.dmg
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# On a version tag (v1.2.3): a GitLab Release linking this pipeline's DMG. Runs on the Mac runner
# like the build (no shared runners, no secrets: the job token may create releases for its own
# project). GitHub builds and releases the same tag separately (.github/workflows/release.yml).
release:
  stage: release
  needs: [dmg]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - >
      curl --fail-with-body -sS -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN"
      --data-urlencode "tag_name=$CI_COMMIT_TAG"
      --data-urlencode "name=WireGuard Bar $CI_COMMIT_TAG"
      --data-urlencode "description=Download WireGuardBar.dmg below. See CHANGELOG.md for what changed."
      --data-urlencode "assets[links][][name]=WireGuardBar.dmg"
      --data-urlencode "assets[links][][url]=$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/WireGuardBar.dmg?job=dmg"
      --data-urlencode "assets[links][][link_type]=package"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
