# On a version tag (v1.2.3): test, build the DMG and publish a GitHub Release with it.
# Independent of GitLab, which builds and releases the same tag on its own.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write   # create the release with the built-in token

jobs:
  release:
    runs-on: macos-15
    env:
      CI_COMMIT_TAG: ${{ github.ref_name }}   # make-dmg.sh names the file from it
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build DMG
        run: |
          scripts/make-dmg.sh
          mv build/WireGuardBar-*.dmg WireGuardBar.dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$CI_COMMIT_TAG" WireGuardBar.dmg
          --title "WireGuard Bar $CI_COMMIT_TAG"
          --notes "Download WireGuardBar.dmg below. See CHANGELOG.md for what changed."
